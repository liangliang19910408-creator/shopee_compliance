<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - Compliance MY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        html, body { height: 100%; }
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #34d399;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white flex items-center justify-center px-4">

    <div class="max-w-md w-full text-center">
        <div id="pendingBlock">
            <div class="spinner mx-auto mb-6"></div>
            <h1 class="text-2xl font-bold mb-2">激活中…</h1>
            <p class="text-slate-400 text-sm">Activating your subscription…</p>
            <p class="text-slate-500 text-xs mt-4">Please wait while we confirm your payment.</p>
        </div>

        <div id="successBlock" class="hidden">
            <div class="text-5xl mb-4">✅</div>
            <h1 class="text-2xl font-bold mb-2">订阅成功！</h1>
            <p class="text-slate-400 text-sm mb-6">Subscription activated successfully!</p>
            <a href="/dashboard" class="inline-block btn-primary px-8 py-3 rounded-xl font-semibold text-white transition" style="background: linear-gradient(135deg, #EE4D2D 0%, #F97316 100%); box-shadow: 0 4px 14px rgba(238,77,45,0.4);">
                进入仪表盘 →
            </a>
        </div>

        <div id="timeoutBlock" class="hidden">
            <div class="text-5xl mb-4">⏳</div>
            <h1 class="text-2xl font-bold mb-2">请稍后刷新</h1>
            <p class="text-slate-400 text-sm mb-6">Payment received, activation may take a moment.</p>
            <a href="/dashboard" class="inline-block px-6 py-3 rounded-xl font-medium text-slate-300 border border-white/20 hover:bg-white/10 transition">
                前往仪表盘
            </a>
        </div>
    </div>

    <script>
        let pollCount = 0;
        const maxPolls = 15;

        const pollTimer = setInterval(async () => {
            try {
                const res = await fetch('/api/creem/status');
                const data = await res.json();

                if (data.status === 'active') {
                    clearInterval(pollTimer);
                    document.getElementById('pendingBlock').classList.add('hidden');
                    document.getElementById('successBlock').classList.remove('hidden');
                    setTimeout(() => { window.location.href = '/dashboard'; }, 2000);
                    return;
                }

                if (++pollCount > maxPolls) {
                    clearInterval(pollTimer);
                    document.getElementById('pendingBlock').classList.add('hidden');
                    document.getElementById('timeoutBlock').classList.remove('hidden');
                }
            } catch (err) {
                console.error('Poll error:', err);
            }
        }, 2000);
    </script>

</body>
</html>
