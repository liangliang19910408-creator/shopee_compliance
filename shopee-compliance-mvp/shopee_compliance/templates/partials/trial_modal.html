<!-- 邮箱弹窗片段 -->
<!-- 此文件已被 index.html 内联使用 -->
<div id="trialModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="card-gradient rounded-2xl w-full max-w-md p-8 mx-4 shadow-2xl relative">
        <!-- Close Button -->
        <button id="modalClose" class="absolute top-4 right-4 text-slate-400 hover:text-white transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <!-- Modal Content -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-orange-500/20 mb-4">
                <span class="text-3xl">🔒</span>
            </div>
            <h2 data-i18n="unlockTrial" class="text-2xl font-bold text-white mb-2">解锁 7 天免费试用</h2>
            <p data-i18n="trialHint" class="text-slate-400 text-sm">输入邮箱即可获得 7 天无限制检测，无需信用卡。</p>
        </div>

        <!-- Modal Form -->
        <form id="trialForm">
            <input id="modalEmail" type="email" required data-i18n="emailPlaceholder"
                class="input-dark w-full px-4 py-3 rounded-xl text-white placeholder-slate-500 outline-none transition mb-4"
                placeholder="your@email.com">

            <button type="submit" data-i18n="unlock"
                class="btn-gradient w-full py-4 text-white font-semibold rounded-xl transition transform shadow-lg">
                解锁试用
            </button>
        </form>
    </div>
</div>
